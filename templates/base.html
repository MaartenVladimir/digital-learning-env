<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DLE{% endblock %}</title>

  <!-- KaTeX for rendering math problems -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- MathLive for math input (ESM — registers <math-field> custom element) -->
  <script type="module">
    import 'https://esm.sh/mathlive';
  </script>

  {% block extra_head %}{% endblock %}

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: sans-serif;
      max-width: 680px;
      margin: 60px auto;
      padding: 0 24px;
      color: #222;
      line-height: 1.5;
    }

    h2 { margin-top: 0; }

    .progress {
      font-size: 0.85em;
      color: #888;
      margin-bottom: 8px;
    }

    .problem-box {
      font-size: 1.6em;
      text-align: center;
      padding: 20px;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin: 16px 0;
    }

    .problem-box-context {
      font-size: 1.1em;
      text-align: left;
      padding: 14px 20px;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin: 16px 0;
    }

    .steps { margin: 16px 0; }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 1.05em;
    }

    .step.correct  { color: #2a7a2a; }
    .step.incorrect { color: #b00; }

    .feedback {
      margin: 12px 0;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95em;
    }

    .feedback.ok      { background: #eaf5ea; border-left: 3px solid #2a7a2a; }
    .feedback.warning { background: #fff8e1; border-left: 3px solid #f9a825; }
    .feedback.error   { background: #fdecea; border-left: 3px solid #b00; }

    math-field {
      width: 100%;
      font-size: 1.2em;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px 12px;
      margin-top: 8px;
    }

    math-field:focus-within {
      outline: 2px solid #4a90d9;
      border-color: transparent;
    }

    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 24px;
      font-size: 1em;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover { background: #357abd; }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      border: 1px solid #ccc;
      margin-right: 6px;
    }

    .btn-secondary:hover { background: #e0e0e0; }

    form input[type="text"], form select {
      font-size: 1em;
      padding: 7px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: 4px;
      width: 260px;
    }

    label { display: block; margin-bottom: 14px; font-weight: 500; }

    .graph-box {
      width: 100%;
      height: 340px;
      margin: 16px 0;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
    }

    .post-crisis-box {
      background: #f0f4ff;
      border-left: 4px solid #4a90d9;
      border-radius: 6px;
      padding: 16px 20px;
      margin: 16px 0;
    }

    .post-crisis-box strong {
      display: block;
      font-size: 1em;
      margin-bottom: 8px;
      color: #2c5ba0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .post-crisis-formula {
      text-align: center;
      margin: 12px 0;
    }

    .post-crisis-prompt {
      margin-top: 12px;
      font-weight: 500;
      color: #444;
    }

    /* ── Input hint modal ── */
    .hint-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .hint-overlay.open { display: flex; }
    .hint-modal {
      background: #fff;
      border-radius: 10px;
      padding: 28px 28px 20px;
      max-width: 520px;
      width: 92%;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .hint-modal h3 {
      margin: 0 0 16px;
      font-size: 1em;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .hint-modal-body { font-size: 1.15em; }
    .hint-modal-close {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 1.3em;
      cursor: pointer;
      background: none;
      border: none;
      color: #888;
      line-height: 1;
    }
    .hint-modal-close:hover { color: #333; }
    .btn-hint {
      display: inline-block;
      margin-top: 12px;
      margin-right: 8px;
      padding: 8px 16px;
      font-size: 0.9em;
      background: #f0f0f0;
      color: #555;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-hint:hover { background: #e4e4e4; }

    /* ── Symbol insert bar ── */
    .insert-bar {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .btn-insert {
      padding: 5px 11px;
      font-size: 1em;
      background: #f5f5f5;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
      line-height: 1;
      vertical-align: middle;
    }
    .btn-insert:hover { background: #e8e8e8; border-color: #aaa; }
    .frac-icon {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.65em;
      line-height: 1.25;
      vertical-align: middle;
      pointer-events: none;
    }
    .frac-icon span:last-child { border-top: 1px solid currentColor; }

    /* ── Home page ── */
    .module-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .module-info { display: flex; align-items: center; gap: 10px; }
    .module-title { font-weight: 500; }

    .badge {
      font-size: 0.75em;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      background: #e0e0e0;
      color: #555;
    }

    .badge-done     { background: #d4edda; color: #1a6b2a; }
    .badge-progress { background: #fff3cd; color: #856404; }
    .badge-new      { background: #e8f0fe; color: #1a56a8; }

    .logout-link { margin-top: 24px; font-size: 0.9em; }

    /* ── Admin ── */
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .admin-header h2 { margin: 0; }

    .klas-id {
      font-size: 0.6em;
      color: #888;
      vertical-align: middle;
      margin-left: 8px;
    }

    .admin-section {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid #e8e8e8;
    }

    .admin-section h3 { margin-top: 0; }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92em;
      margin-bottom: 16px;
    }

    .admin-table th {
      text-align: left;
      padding: 6px 10px;
      border-bottom: 2px solid #e0e0e0;
      color: #666;
      font-weight: 600;
    }

    .admin-table td {
      padding: 7px 10px;
      border-bottom: 1px solid #f0f0f0;
    }

    .admin-date { color: #999; font-size: 0.9em; }
    .admin-empty { color: #999; font-style: italic; }

    .inline-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .btn-sm { padding: 5px 12px; font-size: 0.85em; }

    .badge-treatment { background: #fde8f0; color: #8b1a4a; }
    .badge-control   { background: #e8f0fe; color: #1a56a8; }

    .form-error {
      color: #b00;
      background: #fdecea;
      border-left: 3px solid #b00;
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    /* ── Exercise page layout with help panel ── */
    /* panel(236) + gap(28) + exercise(680) + gap(28) + spacer(236) + body-padding(48) = 1256 */
    body.has-panel { max-width: 1256px; }

    .page-with-panel {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 28px;
    }

    .exercise-main {
      flex: 0 0 680px;
      max-width: 680px;
      min-width: 0;
    }

    /* Invisible right spacer — mirrors the panel width to keep exercise centered */
    .panel-spacer {
      width: 236px;
      flex-shrink: 0;
    }

    @media (max-width: 1050px) {
      .info-panel, .panel-spacer { display: none; }
      body.has-panel { max-width: 680px; }
    }

    .info-panel {
      width: 236px;
      flex-shrink: 0;
      position: sticky;
      top: 20px;
      align-self: flex-start;
      background: #f7f9fc;
      border: 1px solid #dde4f0;
      border-radius: 8px;
      overflow: hidden;
    }

    .info-panel-header {
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.78em;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #5a6a8a;
      background: #edf0f8;
      border-bottom: 1px solid #dde4f0;
    }

    /* ── Accordion ── */
    .acc-item { border-bottom: 1px solid #dde4f0; }
    .acc-item:last-child { border-bottom: none; }

    .acc-btn {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 10px 14px;
      font-size: 0.84em;
      color: #334466;
      cursor: pointer;
      line-height: 1.4;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
    }
    .acc-btn::after {
      content: '\25B8';
      font-size: 0.75em;
      color: #8899bb;
      flex-shrink: 0;
      margin-top: 2px;
      transition: transform 0.15s;
    }
    .acc-btn[aria-expanded="true"]::after { transform: rotate(90deg); }
    .acc-btn:hover { background: #eef1f8; }

    .acc-panel {
      padding: 4px 14px 12px;
      font-size: 0.83em;
      color: #444;
      line-height: 1.55;
    }
    .acc-panel p { margin: 5px 0; }
    .acc-panel kbd {
      display: inline-block;
      padding: 1px 5px;
      font-size: 0.9em;
      background: #fff;
      border: 1px solid #bcc;
      border-bottom-width: 2px;
      border-radius: 3px;
      font-family: monospace;
    }
    .acc-formula {
      text-align: center;
      margin: 8px 0 4px;
      overflow-x: auto;
    }

    /* ── Selftest ── */
    .selftest-intro-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .selftest-intro-modal {
      background: #fff;
      border-radius: 10px;
      padding: 32px 28px 24px;
      max-width: 480px;
      width: 92%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .selftest-intro-modal h3 { margin: 0 0 12px; }
    .selftest-intro-modal p  { margin: 0 0 20px; color: #444; }

    .selftest-result-row {
      padding: 10px 0;
      font-size: 1.1em;
      font-weight: 600;
    }
    .selftest-result-row.correct  { color: #2a7a2a; }
    .selftest-result-row.incorrect { color: #b00; }

    .selftest-expected {
      padding: 6px 0 10px;
      font-size: 1em;
      color: #333;
    }
  </style>
</head>
<body{% block body_class %}{% endblock %}>
{% block content %}{% endblock %}
</body>
</html>
