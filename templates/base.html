<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DLE{% endblock %}</title>

  <!-- KaTeX for rendering math problems -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <!-- MathLive for math input (ESM — registers <math-field> custom element) -->
  <script type="module">
    import 'https://esm.sh/mathlive';
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: sans-serif;
      max-width: 680px;
      margin: 60px auto;
      padding: 0 24px;
      color: #222;
      line-height: 1.5;
    }

    h2 { margin-top: 0; }

    .progress {
      font-size: 0.85em;
      color: #888;
      margin-bottom: 8px;
    }

    .problem-box {
      font-size: 1.6em;
      text-align: center;
      padding: 20px;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin: 16px 0;
    }

    .steps { margin: 16px 0; }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 1.05em;
    }

    .step.correct  { color: #2a7a2a; }
    .step.incorrect { color: #b00; }

    .feedback {
      margin: 12px 0;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95em;
    }

    .feedback.ok      { background: #eaf5ea; border-left: 3px solid #2a7a2a; }
    .feedback.warning { background: #fff8e1; border-left: 3px solid #f9a825; }
    .feedback.error   { background: #fdecea; border-left: 3px solid #b00; }

    math-field {
      width: 100%;
      font-size: 1.2em;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px 12px;
      margin-top: 8px;
    }

    math-field:focus-within {
      outline: 2px solid #4a90d9;
      border-color: transparent;
    }

    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 24px;
      font-size: 1em;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover { background: #357abd; }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      border: 1px solid #ccc;
      margin-right: 6px;
    }

    .btn-secondary:hover { background: #e0e0e0; }

    form input[type="text"], form select {
      font-size: 1em;
      padding: 7px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: 4px;
      width: 260px;
    }

    label { display: block; margin-bottom: 14px; font-weight: 500; }

    .post-crisis-box {
      background: #f0f4ff;
      border-left: 4px solid #4a90d9;
      border-radius: 6px;
      padding: 16px 20px;
      margin: 16px 0;
    }

    .post-crisis-box strong {
      display: block;
      font-size: 1em;
      margin-bottom: 8px;
      color: #2c5ba0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .post-crisis-formula {
      text-align: center;
      margin: 12px 0;
    }

    .post-crisis-prompt {
      margin-top: 12px;
      font-weight: 500;
      color: #444;
    }

    /* ── Home page ── */
    .module-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .module-info { display: flex; align-items: center; gap: 10px; }
    .module-title { font-weight: 500; }

    .badge {
      font-size: 0.75em;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      background: #e0e0e0;
      color: #555;
    }

    .badge-done     { background: #d4edda; color: #1a6b2a; }
    .badge-progress { background: #fff3cd; color: #856404; }
    .badge-new      { background: #e8f0fe; color: #1a56a8; }

    .logout-link { margin-top: 24px; font-size: 0.9em; }

    /* ── Admin ── */
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .admin-header h2 { margin: 0; }

    .klas-id {
      font-size: 0.6em;
      color: #888;
      vertical-align: middle;
      margin-left: 8px;
    }

    .admin-section {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid #e8e8e8;
    }

    .admin-section h3 { margin-top: 0; }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92em;
      margin-bottom: 16px;
    }

    .admin-table th {
      text-align: left;
      padding: 6px 10px;
      border-bottom: 2px solid #e0e0e0;
      color: #666;
      font-weight: 600;
    }

    .admin-table td {
      padding: 7px 10px;
      border-bottom: 1px solid #f0f0f0;
    }

    .admin-date { color: #999; font-size: 0.9em; }
    .admin-empty { color: #999; font-style: italic; }

    .inline-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .btn-sm { padding: 5px 12px; font-size: 0.85em; }

    .badge-treatment { background: #fde8f0; color: #8b1a4a; }
    .badge-control   { background: #e8f0fe; color: #1a56a8; }

    .form-error {
      color: #b00;
      background: #fdecea;
      border-left: 3px solid #b00;
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
