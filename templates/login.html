{% extends "base.html" %}
{% block title %}Inloggen — DLE{% endblock %}
{% block content %}

<h2>Digitale Leeromgeving</h2>

{% if error %}
<p class="form-error">{{ error }}</p>
{% endif %}

<form method="post" action="/login">
  <label>
    Klas
    <input type="text" name="class_id" required autofocus placeholder="bijv. 1a">
  </label>
  <label>
    Leerlingnummer
    <input type="text" name="student_id" required placeholder="bijv. leerling01">
  </label>
  <button type="submit" class="btn">Inloggen</button>
</form>

{% endblock %}
