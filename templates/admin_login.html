{% extends "base.html" %}
{% block title %}Beheer — Inloggen{% endblock %}
{% block content %}

<h2>Beheer</h2>

{% if error %}
<p class="form-error">{{ error }}</p>
{% endif %}

<form method="post" action="/admin/login">
  <label>
    Wachtwoord
    <input type="password" name="password" required autofocus>
  </label>
  <button type="submit" class="btn">Inloggen</button>
</form>

{% endblock %}
