{% extends "base.html" %}
{% block title %}Module {{ module_id }} — DLE{% endblock %}
{% block content %}

<p class="progress">Module {{ module_id }} &mdash; opgave {{ item_num }} van {{ total }}</p>

<div class="problem-box">
  <span id="problem-display"></span>
</div>

<div class="steps" id="steps"></div>

<div id="input-area">
  <math-field id="mf" virtual-keyboard-mode="onfocus"></math-field>
  <br>
  <button class="btn" onclick="checkStep()">Controleer stap</button>
</div>

<div id="feedback" class="feedback" style="display:none"></div>

<script>
  const ITEM_ID   = {{ item.id | tojson }};
  const PROBLEM   = {{ item.display | tojson }};
  const MODULE_ID = {{ module_id | tojson }};

  // Render the problem with KaTeX
  katex.render(PROBLEM, document.getElementById('problem-display'), {
    throwOnError: false,
    displayMode: true,
  });

  const mf         = document.getElementById('mf');
  const stepsEl    = document.getElementById('steps');
  const feedbackEl = document.getElementById('feedback');

  function showFeedback(text, type) {
    feedbackEl.textContent = text;
    feedbackEl.className   = 'feedback ' + type;
    feedbackEl.style.display = text ? 'block' : 'none';
  }

  function addStepToHistory(text, correct) {
    const div = document.createElement('div');
    div.className = 'step ' + (correct ? 'correct' : 'incorrect');
    div.textContent = (correct ? '✓  ' : '✗  ') + text;
    stepsEl.appendChild(div);
  }

  function checkStep() {
    // getValue('ascii-math') gives plain text like "x/2 + 1 = 3"
    const step = mf.getValue('ascii-math').trim();
    if (!step) return;

    fetch('/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ step }),
    })
    .then(r => r.json())
    .then(data => {
      addStepToHistory(step, data.is_correct);

      const msg = data.message;

      if (data.status === 'COMPLETE') {
        showFeedback('Goed gedaan! Volgende opgave...', 'ok');
        document.getElementById('input-area').style.display = 'none';
        setTimeout(() => location.reload(), 1400);
        return;
      }

      if (!data.is_correct) {
        showFeedback(msg || 'Deze stap klopt niet.', 'error');
        return;
      }

      if (data.status === 'CORRECT_SUBOPTIMAL') {
        showFeedback(msg, 'warning');
      } else if (data.status === 'EQUIVALENT_BUT_NO_PROGRESS') {
        showFeedback('Correct, maar je bent nog niet verder gekomen.', 'warning');
      } else {
        showFeedback('', 'ok');
      }

      mf.setValue('');
      mf.focus();
    });
  }

  // Submit on Enter
  mf.addEventListener('keydown', e => {
    if (e.key === 'Enter') checkStep();
  });

  mf.focus();
</script>

{% endblock %}
